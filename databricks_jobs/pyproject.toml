[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "databricks-jobs"
version = "0.1.0"
description = "Atliq Commerce Databricks data pipelines"
requires-python = ">=3.10"

[project.scripts]
silver_customers = "src.silver.customers:main"
silver_products = "src.silver.products:main"
silver_marketing_spend = "src.silver.marketing_spend:main"
silver_supplier_price_list = "src.silver.supplier_price_list:main"
silver_order_items = "src.silver.order_items:main"
silver_orders = "src.silver.orders:main"
silver_payments = "src.silver.payments:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]