# ============================================================================
# schema_baseline.yml
#
# Expected ("known good") column list for each source table, used by the
# schema drift check before Bronze/Silver processing runs. Update this file
# deliberately whenever a schema change is intentional (e.g., a new column
# added upstream) so drift detection stays accurate.
#
# Derived from the AtliQ Commerce OLTP schema (dbo.customers, dbo.products,
# dbo.orders, dbo.order_items, dbo.payments).
# ============================================================================

customers:
  - customer_id
  - customer_name
  - email
  - city
  - signup_date
  - updated_at

products:
  - product_id
  - product_name
  - category
  - unit_price
  - updated_at

orders:
  - order_id
  - customer_id
  - order_date
  - status
  - order_amount
  - created_at
  - updated_at

order_items:
  - order_item_id
  - order_id
  - product_id
  - quantity
  - item_price
  - created_at

payments:
  - payment_id
  - order_id
  - amount
  - method
  - paid_at
  - updated_at